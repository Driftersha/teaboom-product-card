<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Карточка товара «Ананасовый улун» интернет-магазина Teaboom">

  <title>Ананасовый улун — Teaboom</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main>
    <section class="product" aria-labelledby="product-title">
      <div class="container">
        <div class="product__card">

          <div class="product__media">
            <img class="product__image" src="./images/pineapple-oolong.jpg" width="970" height="970"
              alt="Чай «Ананасовый улун»">
          </div>

          <div class="product__content">
            <p class="product__category">
              Улун
            </p>

            <h1 class="product__title" id="product-title">
              Ананасовый улун
            </h1>

            <div class="product__options">
              <p class="product__options-title" id="weight-title">
                Выберите фасовку
              </p>

              <div class="product__weights" role="group" aria-labelledby="weight-title">
                <button class="product__weight product__weight--active" type="button" data-weight="100"
                  aria-pressed="true">
                  100 г
                </button>

                <button class="product__weight" type="button" data-weight="500" aria-pressed="false">
                  500 г
                </button>

                <button class="product__weight" type="button" data-weight="1000" aria-pressed="false">
                  1000 г
                </button>

                <button class="product__weight" type="button" data-weight="5000" aria-pressed="false">
                  5000 г
                </button>
              </div>
            </div>

            <p class="product__article">
              Артикул:
              <span class="product__article-value" data-product-article>
                01306
              </span>
            </p>

            <div class="product__prices">
              <del class="product__old-price" data-old-price>
                349,20 ₽
              </del>

              <span class="product__price" data-current-price>
                326,40 ₽
              </span>
            </div>

            <button class="product__cart-button" type="button">
              В корзину
            </button>

            <div class="product__description">
              <h2 class="product__description-title">
                О товаре
              </h2>

              <p class="product__description-text">
                Китайский бирюзовый чай с цукатами и натуральными
                ароматическими маслами. Светлый фуцзяньский улун
                с ароматом ананаса.
              </p>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script src="./js/main.js"></script>
</body>

</html>
